[package]
edition.workspace = true
name = "pixi-platform-tauri"
publish = false
version.workspace = true

[dependencies]
clap.workspace = true
dunce = "1.0"
log.workspace = true
percent-encoding = "2"
pixi-backend.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
