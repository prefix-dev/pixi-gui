[package]
edition.workspace = true
name = "pixi-gui-server"
publish = false
version.workspace = true

[lib]
name = "pixi_gui_server"

[dependencies]
humantime = "2.3.0"
indexmap = "2"
libc = "0.2"
log = "0.4"
memchr = "2.8.3"
miette = "7"
nix = "0.31.3"
notify = "8"
notify-debouncer-full = "0.7"
pixi-gui-server-macros.workspace = true
pixi_api.workspace = true
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strip-ansi-escapes = "0.2"
tokio = { version = "1.47", features = [
  "io-util",
  "macros",
  "process",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
which = "8.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4.5"
