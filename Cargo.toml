[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
pixi-apps-backend = { path = "crates/pixi-apps-backend" }
pixi-apps-backend-macros = { path = "crates/pixi-apps-backend-macros" }
pixi-apps-platform-tauri = { path = "crates/pixi-apps-platform-tauri" }
pixi-apps-platform-web = { path = "crates/pixi-apps-platform-web" }

pixi_api = { package = "pixi_api", git = "https://github.com/prefix-dev/pixi", tag = "v0.83.0" }

axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "7"
dunce = "1.0"
env_logger = "0.11"
getrandom = "0.4"
humantime = "2.3"
indexmap = "2"
jsonwebtoken = { version = "11", default-features = false, features = [
  "aws_lc_rs",
] }
libc = "0.2"
listenfd = "1"
log = "0.4"
memchr = "2.8.3"
memory-serve = "2"
miette = "7"
nix = "0.31.3"
notify = "8"
notify-debouncer-full = "0.7"
open = "5"
percent-encoding = "2"
portable-pty = "0.9"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strip-ansi-escapes = "0.2"
strum = { version = "0.28", features = ["derive"] }
subtle = "2"
syn = { version = "3", features = ["full"] }
tao = "0.37.0"
tauri = { version = "~2.12", features = ["devtools"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "~2.8.0"
tauri-plugin-log = "~2.10.0"
tauri-plugin-notification = "~2.6.0"
tauri-plugin-opener = "~2.7.0"
tauri-plugin-single-instance = "2"
tokio = "1.47"
tokio-test = "0.4.5"
toml = "1"
uuid = { version = "1.18", features = ["v4"] }
which = "8.0.0"
windows-sys = "0.61"

[patch.crates-io]
# Redirect crates.io's `reqwest-middleware` to pixi's shim that re-exports
# `astral-reqwest-middleware`. This unifies the `Middleware` trait identity
# between consumers that depend on the original crate name (e.g.
# `http-cache-reqwest`) and consumers that depend on the renamed
# `astral-reqwest-middleware` (rattler, rattler-build, uv). pixi's own workspace
# applies this patch, but `[patch]` sections do not propagate through the
# `pixi_api` git dependency, so it has to be repeated here. Keep the tag in sync
# with `pixi_api`. 
reqwest-middleware = { git = "https://github.com/prefix-dev/pixi", tag = "v0.83.0" }
version-ranges = { git = "https://github.com/astral-sh/pubgrub", rev = "d8efd77673c9a90792da9da31b6c0da7ea8a324b" }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
