context:
  version: "${{ env.get('PIXI_APPS_VERSION', default='0.1.0dev') }}"
  exe_suffix: ${{ ".exe" if win else "" }}
  icon_ext: ${{ "icns" if osx else ("ico" if win else "png") }}
  pnpm: ${{ "pnpm.bat" if win else "pnpm" }}

recipe:
  name: pixi-apps
  version: ${{ version }}

source:
  path: ".."

build:
  number: 0

outputs:
  - staging:
      name: pixi-apps-build
    requirements:
      build:
        - ${{ compiler('rust') }}
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - brush
        - cargo-bundle-licenses
        - nodejs
        - pnpm
        - if: linux
          then:
            - pkg-config
            - make
      host:
        - if: linux
          then:
            - cairo
            - expat
            - fontconfig
            - gdk-pixbuf
            - glib
            - gtk3
            - libsoup
            - pango
            - webkit2gtk4.1 >=2.48.5
            - xorg-xorgproto
            - zlib
    build:
      script:
        interpreter: brush
        env:
          # Keep compiler flags identical between builds so cached build output
          # stays valid. Doesn't affect the package version.
          PKG_VERSION: "0"
          PIXI_APPS_VERSION: ${{ version }}
        content:
          - |
            unset CI
            export CARGO_TARGET_DIR="${SRC_DIR}/../../target-cache"
          # Required to fix "path too long" issues on CI. GITHUB_ACTIONS is read at
          # recipe render time, so this applies under the default strict environment
          # isolation where the variable is not forwarded to the build script.
          - if: win and env.get("GITHUB_ACTIONS", default="")
            then: |
              export CARGO_HOME="C:\\cargo-home"
              mkdir -p "${CARGO_HOME}"
          # WebKit framework linking for macOS, see https://crates.io/crates/wry/0.37.0
          - if: osx
            then: |
              export RUSTFLAGS="-l framework=WebKit"

          - |
            ${{ pnpm }} install

            # Frontends from frontend/, each one gets embedded into the Tauri app and
            # its web counterpart, so they have to be built before cargo runs
            ${{ pnpm }} --recursive build

            # All apps in one cargo invocation, so their features get unified and shared
            # dependencies only get compiled once. tauri/custom-protocol makes the Tauri
            # apps serve their embedded frontend.
            cargo build --release -p pixi-gui -p pixi-gui-web --features tauri/custom-protocol

            cargo_toml_field() {
              local re="$2 = \"([^\"]*)\""
              [[ $(<"$1/Cargo.toml") =~ ${re} ]] && printf '%s' "${BASH_REMATCH[1]}"
            }

            install_app() {
              local kind=$1 pkg_name=$2
              local crate_dir="crates/${pkg_name}"

              # The conda-forge rust compiler activates with CARGO_BUILD_TARGET set,
              # so cargo nests its output under the target triple
              mkdir -p "${PREFIX}/bin"
              cp "${CARGO_TARGET_DIR}/${CARGO_BUILD_TARGET}/release/${pkg_name}${{ exe_suffix }}" "${PREFIX}/bin/"

              (cd "${crate_dir}" && cargo-bundle-licenses --format yaml --output "${SRC_DIR}/THIRDPARTY-${pkg_name}.yml")

              local menu
              menu=$(<"${RECIPE_DIR}/menu/${kind}.json")
              menu=${menu//__PKG_NAME__/${pkg_name}}
              menu=${menu//__PKG_VERSION__/${{ version }}}
              menu=${menu//__APP_ID__/dev.prefix.${pkg_name}}
              menu=${menu//__DISPLAY_NAME__/$(cargo_toml_field "${crate_dir}" display-name)}
              menu=${menu//__DESCRIPTION__/$(cargo_toml_field "${crate_dir}" description)}
              mkdir -p "${PREFIX}/Menu"
              printf '%s\n' "${menu}" > "${PREFIX}/Menu/${pkg_name}_menu.json"
              cp "${crate_dir}/icons/icon.${{ icon_ext }}" "${PREFIX}/Menu/${pkg_name}.${{ icon_ext }}"
            }

            install_app tauri pixi-gui
            install_app web pixi-gui-web

  - package:
      name: pixi-gui
    inherit: pixi-apps-build
    requirements:
      build:
        - ${{ stdlib('c') }}
    build:
      files:
        - bin/pixi-gui${{ exe_suffix }}
        - Menu/pixi-gui_menu.json
        - Menu/pixi-gui.${{ icon_ext }}
      dynamic_linking:
        # Part of Windows itself
        missing_dso_allowlist:
          - "**/api-ms-win-core-winrt-*.dll"
    about:
      license_file:
        - LICENSE.md
        - THIRDPARTY-pixi-gui.yml
    tests:
      - script:
          - pixi-gui --version

  - package:
      name: pixi-gui-web
    inherit:
      from: pixi-apps-build
      run_exports: false
    requirements:
      build:
        - ${{ compiler('rust') }}
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
    build:
      files:
        - bin/pixi-gui-web${{ exe_suffix }}
        - Menu/pixi-gui-web_menu.json
        - Menu/pixi-gui-web.${{ icon_ext }}
    about:
      license_file:
        - LICENSE.md
        - THIRDPARTY-pixi-gui-web.yml
    tests:
      - script:
          - pixi-gui-web --version
