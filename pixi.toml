[workspace]
authors = ["Felix Häcker <felix@prefix.dev>"]
channels = ["https://prefix.dev/conda-forge"]
description = "Package Management Made Easy!"
name = "pixi-apps"
platforms = [
  "osx-arm64",
  { platform = "linux-64", glibc = "2.34" },
  "win-64",
  "osx-64",
]

#
# Feature: Default
#

[dependencies]
compilers = ">=2,<3"
concurrently = ">=10.0.6,<11"
pnpm = ">=12.4,<13"
rust = ">=1.97,<1.98"
rust-src = ">=1.97,<1.98"
tauri = ">=2.9.2,<3"

[target.unix.dependencies]
watchexec = ">=2.8.0,<3" # TODO: Port feedstock to Windows

[target.linux-64.dependencies]
cairo = ">=1.18.4,<2"
expat = ">=2.7.1,<3"
fontconfig = ">=2.15.0,<3"
gdk-pixbuf = ">=2.42.12,<3"
glib = ">=2.84.3,<3"
gtk3 = ">=3.24.43,<4"
pango = ">=1.56.4,<2"
pkg-config = ">=0.29.2,<0.30"
"webkit2gtk4.1" = ">=2.48.5,<3"
xorg-xorgproto = ">=2025.1,<2026"
zlib = ">=1.3.1,<2"

[tasks]
backend-test = "cargo test --workspace"
frontend-install-deps = "pnpm install"
react-devtools = { cmd = "pnpm react-devtools", depends-on = [
  "frontend-install-deps",
], env = { HOST = "localhost" } }

[tasks.tauri]
args = [{ arg = "app", choices = ["pixi-gui"] }]
cmd = "pnpm tauri dev"
depends-on = ["frontend-install-deps"]
env = { TAURI_APP_PATH = "crates/{{ app }}" }

[tasks.web]
args = [{ arg = "app", choices = ["pixi-gui"] }]
cmd = """concurrently --kill-others --names backend,frontend \
  'watchexec --socket 127.0.0.1:5174 --restart --watch crates --exts rs,toml -- cargo run -p {{ app }}-web' \
  'pnpm --filter {{ app }} dev' \
"""
depends-on = ["frontend-install-deps"]

#
# Feature: Lint
#

[feature.lint.dependencies]
actionlint = ">=1.7.9,<2"
cargo-deny = ">=0.19,<0.20"
lefthook = ">=2.0.1,<3"
mypy = ">=2.1,<3"
ruff = ">=0.15,<0.16"
shellcheck = ">=0.11,<0.12"
taplo = ">=0.10.0,<0.11"
typos = ">=1.36.1,<2"

[feature.lint.tasks]
lefthook = { cmd = "lefthook", description = "Run lefthook" }
pre-commit-install = "lefthook install"
pre-commit-install-minimal = "lefthook install pre-commit"

# Backend
backend-format = "cargo fmt --all"
backend-lint = "cargo clippy --all-targets --workspace -- -D warnings"

# Frontend
frontend-format = { cmd = "pnpm exec prettier . --write" }
frontend-lint = { cmd = "pnpm exec eslint . --fix --max-warnings=0 ", depends-on = [
  "frontend-install-deps",
] }

# Other
actionlint = { cmd = "actionlint" }
cargo-deny = "cargo deny check license --deny warnings"
license-check = { cmd = "pnpm license-checker --onlyAllow 'Apache-2.0;BSD-3-Clause;MIT;ISC'", depends-on = [
  "frontend-install-deps",
] }
python-typecheck = "mypy --config-file scripts/mypy.ini ./scripts"
ruff-format = "ruff format --exit-non-zero-on-format --force-exclude"
ruff-lint = "ruff check --fix --exit-non-zero-on-fix --force-exclude"
toml-format = { cmd = "taplo fmt *.toml crates/*/Cargo.toml", env = { RUST_LOG = "warn" } }
toml-lint = "taplo lint *.toml crates/*/Cargo.toml --verbose"
typos = "typos --force-exclude"

# Combined
lint = { depends-on = [
  "frontend-install-deps",
  "lint-fast",
  "lint-slow",
], description = "Run all linters and formatters on all code" }
lint-fast = { cmd = "lefthook run pre-commit --all-files --force", description = "Run all fast linters and formatters on all code (no clippy)" }
lint-slow = { cmd = "lefthook run pre-push --all-files --force", description = "Run all slow linters and formatters on all code" }

#
# Feature: Packaging
#

[feature.packaging.dependencies]
python = ">=3.14,<3.15"
rattler-build = ">=0.77,<0.78"

[feature.packaging.tasks]
build-packages = "python scripts/build_packages.py"
upload-packages = "python scripts/upload_packages.py"

#
# Feature: Automation
#

[feature.automation.dependencies]
pygithub = ">=2,<3"
python = ">=3.14,<3.15"
tomlkit = ">=0.13,<1"

[feature.automation.tasks]
create-pixi-update-pr = { cmd = "python scripts/bump_pixi.py pr", depends-on = [
  "update-pixi",
] }
update-pixi = "python scripts/bump_pixi.py update"

#
# Environments
#

[environments]
default = ["lint", "automation"]
packaging = { features = ["packaging"], no-default-feature = true }
