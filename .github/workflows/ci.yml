name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - bump-pixi

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ hashFiles('pixi.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run lint check
        run: pixi run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ hashFiles('pixi.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run tests
        run: pixi run backend-test

  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: packaging
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - name: Resolve Rust version
        id: rust
        shell: bash
        run: echo "version=$(pixi run --environment=packaging build-package --rust-version)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> output/bld/target-cache"
          key: rust-${{ steps.rust.outputs.version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build package
        run: pixi run --environment=packaging build-package
        env:
          RATTLER_BUILD_ENABLE_GITHUB_INTEGRATION: true
          RATTLER_BUILD_COLOR: always
      - name: Upload package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pixi run --environment=packaging upload-package

  build-intel-mac:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: packaging
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - name: Resolve Rust version
        id: rust
        shell: bash
        run: echo "version=$(pixi run --environment=packaging build-package --rust-version)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> output/bld/target-cache"
          key: rust-${{ steps.rust.outputs.version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build package
        run: pixi run --environment=packaging build-package
        env:
          RATTLER_BUILD_ENABLE_GITHUB_INTEGRATION: true
          RATTLER_BUILD_COLOR: always
      - name: Upload package
        run: pixi run --environment=packaging upload-package
